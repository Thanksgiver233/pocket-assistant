# docker compose — 可选的第二条部署路径
#
# 什么时候用它：本地复现、换机迁移、想用容器隔离。
# 什么时候不用：2C2G 的正式机。Docker 自身约 80–120MB 常驻，原生 systemd
# 方案（deploy/systemd/pa.service）更省；两条路径跑的是同一个二进制。
#
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  pa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pia/personal:0.1.0-p0
    container_name: pa
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 只映射到宿主机回环：公网入口必须经 Nginx。
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    mem_limit: 700m
    cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
